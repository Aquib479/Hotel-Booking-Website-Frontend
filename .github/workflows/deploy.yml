name: Deploy Frontend

# Manual deploy only. In Actions → Deploy Frontend, click "Run workflow"
# and choose the branch in "Use workflow from".
on:
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

# OIDC: mint a short-lived AWS token. No long-lived access keys in GitHub.
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-southeast-1
  S3_BUCKET: resthalfv2-prod-web
  CLOUDFRONT_DISTRIBUTION_ID: E2Z7I6SCSFIFBP
  AWS_ROLE_ARN: arn:aws:iam::439594592406:role/github-actions-frontend

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show deploy target
        run: |
          echo "Ref: ${{ github.ref_name }}"
          echo "SHA: $(git rev-parse HEAD)"

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_ZENTRUMHUB_API_KEY: ${{ secrets.VITE_ZENTRUMHUB_API_KEY }}
          VITE_ZENTRUMHUB_ACCOUNT_ID: ${{ secrets.VITE_ZENTRUMHUB_ACCOUNT_ID }}
          VITE_ZENTRUMHUB_CHANNEL_ID: ${{ secrets.VITE_ZENTRUMHUB_CHANNEL_ID }}
          VITE_ZENTRUMHUB_NEXUS_URL: ${{ vars.VITE_ZENTRUMHUB_NEXUS_URL }}
          VITE_ZENTRUMHUB_AUTOSUGGEST_URL: ${{ vars.VITE_ZENTRUMHUB_AUTOSUGGEST_URL }}
          VITE_ZENTRUMHUB_CURRENCY: ${{ vars.VITE_ZENTRUMHUB_CURRENCY }}
          VITE_ZENTRUMHUB_CULTURE: ${{ vars.VITE_ZENTRUMHUB_CULTURE }}
        run: pnpm build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync assets to S3
        run: |
          aws s3 sync dist "s3://$S3_BUCKET" --delete \
            --exclude "index.html" \
            --cache-control "public,max-age=31536000,immutable"

      - name: Upload index.html
        run: |
          aws s3 cp dist/index.html "s3://$S3_BUCKET/index.html" \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "text/html; charset=utf-8"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*"

      - name: Deploy summary
        run: |
          echo "### Frontend deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Ref:** \`${{ github.ref_name }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **SHA:** \`$(git rev-parse --short HEAD)\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Auth:** GitHub OIDC → \`github-actions-frontend\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **URL:** https://www.resthalf.com" >> "$GITHUB_STEP_SUMMARY"
